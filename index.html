<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lok Deep Public School - Online Application</title>
    <!-- Professional Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #800000;
            --primary-hover: #a31515;
            --bg-color: #f4f7f6;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px 10px; 
            color: var(--text-main);
        }

        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            background-color: #ffffff; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); 
            overflow: hidden;
        }
        
        .header { 
            background: linear-gradient(135deg, var(--primary-color) 0%, #4a0000 100%); 
            color: white; 
            text-align: center; 
            padding: 40px 20px; 
        }

        .header h1 { 
            font-family: 'Montserrat', sans-serif; 
            margin: 0 0 10px 0; 
            font-size: 32px; 
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header p { 
            margin: 5px 0; 
            font-size: 15px; 
            font-weight: 400;
            opacity: 0.9;
        }
        
        .form-content {
            padding: 40px;
        }

        .section-title { 
            font-family: 'Montserrat', sans-serif;
            font-size: 20px; 
            color: var(--primary-color);
            border-bottom: 2px solid #edf2f7; 
            padding-bottom: 10px;
            margin: 30px 0 20px 0;
            display: flex;
            align-items: center;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        /* Grid Layout */
        .grid-2 { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
        }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; gap: 15px; }
            .form-content { padding: 25px 20px; }
            .header h1 { font-size: 26px; }
        }

        .form-group { 
            margin-bottom: 20px; 
        }

        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: var(--text-main); 
            font-size: 14px; 
        }

        input[type="text"], 
        input[type="email"], 
        input[type="date"], 
        select { 
            width: 100%; 
            padding: 12px 16px; 
            border: 1.5px solid var(--border-color); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
            font-size: 15px; 
            background-color: var(--input-bg); 
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #a0aec0;
        }

        input:focus, 
        select:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(128, 0, 0, 0.1);
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 30px;
            background-color: #fffafb;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #fed7d7;
        }

        .checkbox-group input {
            margin-top: 3px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
        }

        .checkbox-group label {
            margin-bottom: 0;
            font-size: 14px;
            line-height: 1.5;
            color: var(--primary-color);
        }

        .btn-submit { 
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
            color: white; 
            padding: 16px 24px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 18px; 
            font-weight: 600; 
            font-family: 'Montserrat', sans-serif;
            margin-top: 25px; 
            box-shadow: 0 4px 12px rgba(128, 0, 0, 0.2);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(128, 0, 0, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>LOK DEEP PUBLIC SCHOOL</h1>
        <p>Near Sonbarsa Bridge, Mahua Road, Muzaffarpur</p>
        <p style="margin-top: 10px; font-weight: 500; font-size: 16px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 10px; display: inline-block;">
            Online Application for Primary Teacher (Nursery to Class 5)
        </p>
    </div>

    <div class="form-content">
        <form action="https://api.web3forms.com/submit" method="POST">

            <!-- Web3Forms Hidden Inputs -->
            <input type="hidden" name="access_key" value="fac38f3d-1e6b-4a2e-8ec4-ba75bcc85c4b">
            <input type="hidden" name="redirect" value="https://web3forms.com/success">
            <input type="hidden" name="subject" value="New Teacher Application Received">

            <h2 class="section-title">1. व्यक्तिगत जानकारी (Personal Information)</h2>
            
            <div class="form-group">
                <label>पूरा नाम (Full Name)</label>
                <input type="text" name="Full_Name" placeholder="अपना पूरा नाम लिखें" required>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label>पिता का नाम (Father's Name)</label>
                    <input type="text" name="Father_Name" placeholder="पिता का नाम" required>
                </div>
                
                <div class="form-group">
                    <label>माता का नाम (Mother's Name)</label>
                    <input type="text" name="Mother_Name" placeholder="माता का नाम" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>जन्म तिथि (Date of Birth)</label>
                    <input type="date" name="DOB" required>
                </div>
                <div class="form-group">
                    <label>ब्लड ग्रुप (Blood Group)</label>
                    <select name="Blood_Group">
                        <option value="">चुनें...</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>वैवाहिक स्थिति (Marital Status)</label>
                    <select name="Marital_Status" required>
                        <option value="">चुनें...</option>
                        <option value="Unmarried">अविवाहित (Unmarried)</option>
                        <option value="Married">विवाहित (Married)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>कैटेगरी (Category)</label>
                    <select name="Category" required>
                        <option value="">चुनें...</option>
                        <option value="General">General</option>
                        <option value="OBC">OBC</option>
                        <option value="EBC">EBC</option>
                        <option value="SC">SC</option>
                        <option value="ST">ST</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>आधार नंबर (Aadhaar Number) - 12 Digits</label>
                <input type="text" name="Aadhaar_Number" placeholder="XXXX XXXX XXXX" maxlength="14" required>
            </div>

            <h2 class="section-title">2. संपर्क जानकारी (Contact Details)</h2>
            
            <div class="form-group">
                <label>पूरा पता पिन कोड सहित (Full Residential Address)</label>
                <input type="text" name="Address" placeholder="मकान नंबर, गली/गांव, शहर, पिन कोड..." required>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label>WhatsApp / मोबाइल नंबर</label>
                    <input type="text" name="Phone" placeholder="10 अंकों का मोबाइल नंबर" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label>ईमेल आईडी (Email Address)</label>
                    <input type="email" name="Email" placeholder="example@gmail.com" required>
                </div>
            </div>

            <h2 class="section-title">3. शैक्षिक योग्यता (Educational Qualifications)</h2>
            
            <div class="grid-2">
                <div class="form-group">
                    <label>10th (Matriculation)</label>
                    <input type="text" name="Class_10" placeholder="बोर्ड, वर्ष, प्रतिशत (उदा: CBSE, 2012, 75%)" required>
                </div>
                <div class="form-group">
                    <label>12th (Intermediate)</label>
                    <input type="text" name="Class_12" placeholder="बोर्ड, वर्ष, प्रतिशत (उदा: BSEB, 2014, 70%)" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>ग्रेजुएशन (Graduation) <span style="color: #718096; font-weight: 400;">(वैकल्पिक)</span></label>
                    <input type="text" name="Graduation" placeholder="यूनिवर्सिटी, वर्ष, प्रतिशत">
                </div>
                <div class="form-group">
                    <label>D.El.Ed / B.Ed <span style="color: #718096; font-weight: 400;">(वैकल्पिक)</span></label>
                    <input type="text" name="Professional_Degree" placeholder="यूनिवर्सिटी, वर्ष, प्रतिशत">
                </div>
            </div>

            <div class="form-group">
                <label>अन्य अनुभव या रिज्यूमे लिंक (Experience / Resume Link)</label>
                <input type="text" name="Experience_Or_Resume_Link" placeholder="अपने पिछले अनुभव के बारे में लिखें या Google Drive लिंक दें...">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="declaration" name="Declaration" required> 
                <label for="declaration">मैं घोषणा करता/करती हूँ कि इस आवेदन फॉर्म में मेरे द्वारा दी गई सभी जानकारी मेरी पूरी जानकारी और विश्वास के अनुसार सत्य और सही है।</label>
            </div>

            <button type="submit" class="btn-submit">Submit Application</button>
        </form>
    </div>
</div>

</body>
</html>
